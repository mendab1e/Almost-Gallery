<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self'; script-src 'self'" />
    <title>Almost Gallery</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">
        <span class="eyebrow">Hugo photo workflow</span>
        <h1>Almost Gallery</h1>
      </div>
      <div class="actions">
        <button id="open-button" class="button secondary">Open folder</button>
        <button id="options-button" class="button secondary">Options</button>
        <button id="export-button" class="button primary" disabled>Export</button>
      </div>
    </header>

    <main>
      <section id="empty-state" class="empty-state">
        <div class="empty-icon">＋</div>
        <h2>Choose a folder of photographs</h2>
        <p>Then drag the images into your publishing order.</p>
        <button id="empty-open-button" class="button primary">Open photo folder</button>
      </section>

      <section id="workspace" class="workspace hidden">
        <div class="folder-row">
          <div>
            <p id="folder-name" class="folder-name"></p>
            <p id="photo-count" class="muted"></p>
          </div>
          <div class="grid-tools">
            <p class="hint">Drag to reorder · Export order runs left to right, top to bottom</p>
            <div class="preview-controls" aria-label="Grid size">
              <span>Grid size</span>
              <button id="preview-smaller" type="button" aria-label="Make previews smaller" title="Make previews smaller">−</button>
              <button id="preview-larger" type="button" aria-label="Make previews larger" title="Make previews larger">+</button>
            </div>
            <button id="gallery-preview-button" class="preview-launch" type="button">Gallery preview</button>
          </div>
        </div>
        <div id="photo-grid" class="photo-grid" aria-live="polite"></div>
      </section>
    </main>

    <div id="status" class="status hidden" role="status"></div>

    <dialog id="options-dialog">
      <form id="options-form" method="dialog">
        <div class="dialog-heading">
          <div>
            <span class="eyebrow">ImageMagick settings</span>
            <h2>Export options</h2>
          </div>
          <button type="button" id="close-options" class="icon-button" aria-label="Close">×</button>
        </div>
        <label>
          Resize geometry
          <input id="resize-input" name="resize" value="2000x2000" required pattern="\d+x\d+[&gt;&lt;^!]?" />
          <small>For example: 1000x1000</small>
        </label>
        <label>
          JPEG quality
          <input id="quality-input" name="quality" type="number" value="85" min="1" max="100" required />
        </label>
        <p id="options-error" class="error"></p>
        <div class="dialog-actions">
          <button type="button" id="reset-options" class="button secondary">Reset defaults</button>
          <button type="submit" class="button primary">Apply options</button>
        </div>
      </form>
    </dialog>

    <dialog id="gallery-preview-dialog" class="gallery-preview-dialog" aria-label="Gallery preview">
      <div class="gallery-preview-shell">
        <header class="gallery-preview-header">
          <div>
            <p id="gallery-preview-name" class="gallery-preview-name"></p>
            <p id="gallery-preview-position" class="gallery-preview-position"></p>
          </div>
          <button id="close-gallery-preview" class="gallery-preview-close" type="button" aria-label="Close gallery preview">×</button>
        </header>
        <div class="gallery-preview-stage">
          <button id="previous-photo" class="gallery-arrow" type="button" aria-label="Previous photo" title="Previous photo">←</button>
          <img id="gallery-preview-image" alt="" />
          <button id="next-photo" class="gallery-arrow" type="button" aria-label="Next photo" title="Next photo">→</button>
        </div>
      </div>
    </dialog>

    <script src="renderer.js"></script>
  </body>
</html>
